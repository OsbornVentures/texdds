name: Static handoff

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate static handoff and release boundaries
        run: |
          python scripts/static_release.py validate
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Require changelog for changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/static_release.py changelog --base "$BASE"
          fi

  package-and-attest:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require release commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Package exact committed source
        run: python scripts/static_release.py package
      - name: Attest packages and changelog
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/texdds-*.zip
            dist/RELEASE.json
            dist/CHANGELOG.md
            dist/SHA256SUMS.txt
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: texdds-handoff-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish tagged handoff
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "TexDDS $RELEASE_TAG static handoff" --notes-file CHANGELOG.md
